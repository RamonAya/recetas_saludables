<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recetas para cuidarte</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="contenedor header-inner">
      <div>
        <a href="index.html" class="logo">Recetas para cuidarte</a>
        <p class="header-subtitulo">
          Recetas sencillas, saludables y pensadas para el día a día.
        </p>
      </div>
    </div>
  </header>

  <main class="contenedor pagina-home">
    <section class="hero-home">
      <div class="hero-home-texto">
        <p class="detalle-etiqueta">Hábitos saludables</p>
        <h1>Comer mejor, paso a paso</h1>
        <p>
          Una colección de recetas sencillas, nutritivas y fáciles de incorporar al día a día.
        </p>
      </div>
    </section>

    <section class="bloque-busqueda">
      <div class="busqueda-wrap">
        <label for="buscadorRecetas" class="busqueda-label">Buscar receta</label>
        <input
          type="text"
          id="buscadorRecetas"
          class="buscador-recetas"
          placeholder="Ej. lentejas, garbanzos, espinacas..."
        />
      </div>

      <div class="filtros-recetas" aria-label="Filtrar recetas por tipo">
        <button class="filtro-btn activo" data-tipo="Todas">Todas</button>
        <button class="filtro-btn" data-tipo="Desayuno">Desayunos</button>
        <button class="filtro-btn" data-tipo="Almuerzo">Almuerzos</button>
        <button class="filtro-btn" data-tipo="Cena">Cenas</button>
        <button class="filtro-btn" data-tipo="Snack">Snacks</button>
      </div>
    </section>

    <section class="seccion-recetas">
      <div class="seccion-encabezado">
        <h2>Recetas</h2>
        <p>Ideas prácticas para cocinar mejor sin complicarte.</p>
      </div>

      <div id="gridRecetas" class="grid-recetas"></div>
      <div id="paginacionRecetas" class="paginacion-recetas"></div>
    </section>
  </main>

  <script src="data/recetas.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
